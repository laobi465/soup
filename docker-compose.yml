# YAML anchor: 统一日志 rotation 配置（C7/I1）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: card-auth-nginx
    ports:
      # C1: 默认绑定 127.0.0.1，避免 admin 后台公网裸奔（需远程访问用反代或 ssh -L）
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./server:/var/www/server
      - ./admin/dist:/var/www/admin
    depends_on:
      php-fpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - card-auth-network
    restart: unless-stopped
    logging: *default-logging

  php-fpm:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: card-auth-php
    volumes:
      - ./server:/var/www/server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - card-auth-network
    restart: unless-stopped
    # I7: PHP 容器资源限制
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null && php -r 'exit(extension_loaded(\"pdo_mysql\") ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  mysql:
    image: mysql:8.0
    container_name: card-auth-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置MYSQL_ROOT_PASSWORD环境变量}
      MYSQL_DATABASE: card_auth
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - card-auth-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: card-auth-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - card-auth-network
    restart: unless-stopped
    # C3: 强制密码，未配置 REDIS_PASSWORD 时容器拒绝启动
    command: >
      sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: card-auth-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # C2: 强制凭据，未配置时容器拒绝启动（不再使用 minioadmin/minioadmin123 兜底）
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - card-auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # MinIO 初始化（一次性运行）
  minio-init:
    image: minio/mc:latest
    container_name: card-auth-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-card-auth}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb local/card-auth --ignore-existing;
      mc ilm rule add local/card-auth --prefix 'apk-source/' --expire-days 7 2>/dev/null || true;
      mc ilm rule add local/card-auth --prefix 'apk-output/' --expire-days 7 2>/dev/null || true;
      mc ilm rule add local/card-auth --prefix 'apk-temp/' --expire-hours 1 2>/dev/null || true;
      echo '=== MinIO lifecycle rules ===';
      mc ilm rule ls local/card-auth;
      echo 'MinIO initialized';
      "
    networks:
      - card-auth-network
    restart: "no"
    logging: *default-logging

  # APK注入微服务
  apk-inject-service:
    build:
      context: ./apk-inject-service
      dockerfile: Dockerfile
    container_name: card-auth-apk-inject
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-card-auth}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 强制要求环境变量，缺失时容器启动报错（不使用默认密码 changeit）
      APK_KEYSTORE_PASSWORD: ${APK_KEYSTORE_PASSWORD:?APK_KEYSTORE_PASSWORD is required}
      APK_KEYSTORE_ALIAS: ${APK_KEYSTORE_ALIAS:-platform}
    volumes:
      # keystore 通过只读挂载注入，不入库不进镜像
      - ./deploy/keystore:/opt/keystore:ro
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - card-auth-network
    restart: unless-stopped
    # C4: dev 也加沙箱（处理用户上传 APK 必须隔离）
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/seccomp-apk-inject.json
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=1g
    logging: *default-logging

  # APK注入队列Worker
  apk-queue-worker:
    build: ./docker/php
    container_name: card-auth-apk-queue-worker
    working_dir: /var/www/server
    command: ["php", "think", "queue:work", "--queue=apk-inject", "--tries=1", "--sleep=3", "--timeout=180"]
    volumes:
      - ./server:/var/www/server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: www
    networks:
      - card-auth-network
    restart: unless-stopped
    # I7: 资源限制
    mem_limit: 512m
    pids_limit: 128
    logging: *default-logging

  # APK注入任务回收调度器（Task 4 / C6, C7）
  # 每 5 分钟扫描卡死的 PROCESSING 任务和超时未提交的 PENDING 任务
  apk-scheduler:
    build: ./docker/php
    container_name: card-auth-apk-scheduler
    working_dir: /var/www/server
    command: sh -c "while true; do php think apk-inject:recover >> /tmp/apk-scheduler.log 2>&1; sleep 300; done"
    volumes:
      - ./server:/var/www/server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: www
    networks:
      - card-auth-network
    restart: unless-stopped
    # I7: 资源限制
    mem_limit: 256m
    pids_limit: 64
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  card-auth-network:
    driver: bridge
