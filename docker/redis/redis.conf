# C3: protected-mode yes（密码由 --requirepass 注入，不再裸奔）
# bind 由 docker 网络隔离控制，redis 仅监听容器内端口
bind 0.0.0.0
port 6379
protected-mode yes
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
always-show-logo no
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
