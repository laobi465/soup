services:
  nginx:
    image: nginx:1.25-alpine
    container_name: card-auth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./server:/var/www/server
      - ./admin/dist:/var/www/admin
      - nginx-logs:/var/log/nginx
    depends_on:
      - php-fpm
    networks:
      - card-auth-network
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  php-fpm:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: card-auth-php
    volumes:
      - ./server:/var/www/server
      - ./docker/php/php-prod.ini:/usr/local/etc/php/php.ini
      - php-logs:/var/log/php
    depends_on:
      - mysql
      - redis
    networks:
      - card-auth-network
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: card-auth-scheduler
    volumes:
      - ./server:/var/www/server
      - ./docker/php/php-prod.ini:/usr/local/etc/php/php.ini
      - php-logs:/var/log/php
    depends_on:
      - mysql
      - redis
    networks:
      - card-auth-network
    restart: always
    command: sh -c "mkdir -p /var/log/php && while true; do php think schedule:run >> /var/log/php/scheduler.log 2>&1; sleep 60; done"

  mysql:
    image: mysql:8.0
    container_name: card-auth-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置MYSQL_ROOT_PASSWORD环境变量}
      MYSQL_DATABASE: card_auth
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - mysql-logs:/var/log/mysql
    networks:
      - card-auth-network
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-alpine
    container_name: card-auth-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - card-auth-network
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf

  minio:
    image: minio/minio:latest
    container_name: card-auth-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - card-auth-network
    restart: unless-stopped

  # MinIO 初始化（一次性运行）
  minio-init:
    image: minio/mc:latest
    container_name: card-auth-minio-init
    depends_on:
      - minio
    environment:
      MINIO_HOST: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-card-auth}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb local/card-auth --ignore-existing;
      mc mb local/apk-source --ignore-existing;
      mc mb local/apk-output --ignore-existing;
      mc mb local/apk-temp --ignore-existing;
      mc ilm add --expire-hours 1 local/apk-temp 2>/dev/null || true;
      mc ilm add --expire-days 7 local/apk-output 2>/dev/null || true;
      mc ilm add --expire-days 7 local/apk-source 2>/dev/null || true;
      echo 'MinIO initialized';
      "
    networks:
      - card-auth-network
    restart: "no"

  # APK注入微服务
  apk-inject-service:
    build:
      context: ./apk-inject-service
      dockerfile: Dockerfile
    container_name: card-auth-apk-inject
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-card-auth}
      APK_KEYSTORE_PASSWORD: ${APK_KEYSTORE_PASSWORD:-changeit}
    volumes:
      - apk-tmp:/tmp
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    depends_on:
      - minio
    networks:
      - card-auth-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # gVisor 沙箱（需要宿主机安装 runsc）
    # runtime: runsc

  # APK注入队列Worker
  apk-queue-worker:
    build: ./docker/php
    container_name: card-auth-apk-queue-worker
    working_dir: /var/www/server
    command: ["php", "think", "queue:work", "--queue=apk-inject", "--tries=3", "--sleep=3", "--timeout=180"]
    volumes:
      - ./server:/var/www/server
    depends_on:
      - mysql
      - redis
    user: www
    networks:
      - card-auth-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nginx-logs:
  php-logs:
  mysql-logs:
  minio-data:
  apk-tmp:

networks:
  card-auth-network:
    driver: bridge
